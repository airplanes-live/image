name: runtime-dev-cleanup

# Prune immutable runtime-dev-YYYYMMDD-<sha> prereleases. The floating
# runtime-dev-latest release is ignored, and the tag currently pinned by
# config-dev is passed as protected so fresh dev image builds do not lose
# their baked runtime overlay.
on:
  schedule:
    - cron: '17 4 * * *'
  push:
    branches: [dev]
    paths:
      - 'runtime-overlay/**'
      - 'config-dev'
      - '.github/workflows/runtime-dev-cleanup.yml'
  workflow_dispatch:
    inputs:
      keep_count:
        description: 'Newest immutable runtime-dev releases to retain'
        type: string
        default: '5'
      keep_days:
        description: 'Also retain immutable runtime-dev releases this many days old or newer'
        type: string
        default: '14'
      dry_run:
        description: 'Log what would be deleted without deleting'
        type: choice
        options: ['true', 'false']
        default: 'true'

permissions:
  contents: write

# Runtime dev publish on dev uses runtime-release-refs/heads/dev. Reusing that
# group keeps cleanup from deleting while a dev runtime release is publishing.
concurrency:
  group: runtime-release-refs/heads/dev
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # The runtime dev stream is anchored on dev. Scheduled workflows
          # are loaded from the default branch, so check out dev explicitly
          # before reading config-dev or running the helper script.
          ref: dev
          persist-credentials: false

      - name: Resolve protected config-dev runtime tag
        id: config-dev
        run: |
          set -euo pipefail
          set -a
          # shellcheck disable=SC1091
          . ./config-dev
          set +a
          if [[ -z "${AIRPLANES_RUNTIME_OVERLAY_TAG:-}" ]]; then
              echo "::error::config-dev did not set AIRPLANES_RUNTIME_OVERLAY_TAG"
              exit 1
          fi
          echo "tag=$AIRPLANES_RUNTIME_OVERLAY_TAG" >> "$GITHUB_OUTPUT"

      - name: Prune stale immutable dev runtime releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUNTIME_DEV_RELEASE_KEEP_COUNT: ${{ github.event.inputs.keep_count || '5' }}
          RUNTIME_DEV_RELEASE_KEEP_DAYS: ${{ github.event.inputs.keep_days || '14' }}
          RUNTIME_DEV_RELEASE_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          bash runtime-overlay/scripts/release-workflow/prune-dev-runtime-releases.sh \
              --protected-tag "${{ steps.config-dev.outputs.tag }}"
