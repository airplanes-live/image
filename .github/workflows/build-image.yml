name: build-image

# Triggers:
#   workflow_dispatch — manual; --ref selects branch. Use this to validate a
#       feature branch / PR before merging:
#         gh workflow run build-image.yml -R airplanes-live/image \
#             -f channel=dev --ref <pr-branch>
#   push to dev — post-merge validation. Every merge to dev rebuilds.
#   push to a stable/v* tag — release build with channel=stable. Cut a tag
#       on main: `git tag stable/v0.1.0 && git push origin stable/v0.1.0`.

on:
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        options: [stable, dev]
        default: dev
  push:
    branches: [dev]
    tags: ['stable/v*']

permissions:
  contents: read

jobs:
  build:
    name: build-${{ github.event.inputs.channel || (startsWith(github.ref, 'refs/tags/stable/') && 'stable') || 'dev' }}-${{ matrix.arch }}
    strategy:
      matrix:
        # armhf code paths exist but firmware package set has not been
        # adapted for dual-arch yet; keep the matrix at arm64 until a
        # follow-up step adds armhf-specific firmware/kernel handling.
        arch: [arm64]
      fail-fast: false
    concurrency:
      group: image-build-${{ github.event.inputs.channel || (startsWith(github.ref, 'refs/tags/stable/') && 'stable') || 'dev' }}-${{ matrix.arch }}-${{ github.ref }}
      cancel-in-progress: true
    # Native arm64 runner: host arch matches our target arch, so the entire
    # pi-gen build runs without qemu-user-aarch64 emulation. Eliminates the
    # ~5-10x emulation overhead on stage-airplanes/02-install-decoder (readsb +
    # dump978 compiles), where the bulk of build time used to live. Free for
    # public repos on free-plan orgs as of GitHub's Jan 2025 announcement.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    env:
      CHANNEL: ${{ github.event.inputs.channel || (startsWith(github.ref, 'refs/tags/stable/') && 'stable') || 'dev' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Load channel config
        run: |
          set -a
          # shellcheck disable=SC1090
          source "config-$CHANNEL"
          set +a
          {
            echo "AIRPLANES_FEED_REPO=$AIRPLANES_FEED_REPO"
            echo "AIRPLANES_FEED_BRANCH=$AIRPLANES_FEED_BRANCH"
            echo "AIRPLANES_READSB_REPO=$AIRPLANES_READSB_REPO"
            echo "AIRPLANES_READSB_BRANCH=$AIRPLANES_READSB_BRANCH"
            echo "CHANNEL=$CHANNEL"
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: airplanes-live/feed
          ref: ${{ env.AIRPLANES_FEED_BRANCH }}
          path: feed

      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af || true

      - name: Install pi-gen build dependencies
        run: |
          sudo apt-get update
          # Native arm64 runner: no qemu-user emulation needed for arm64 target.
          # pi-gen's `depends` file still requires the bare `qemu-arm` command
          # to exist (line 4: qemu-arm:qemu-user-binfmt) — its dependencies_check
          # only does `hash qemu-arm`, never invokes it. Satisfy the check with
          # a /bin/true shim instead of pulling qemu-user-binfmt onto the host.
          sudo apt-get install -y --no-install-recommends \
              quilt parted debootstrap \
              zerofree zip dosfstools libarchive-tools libcap2-bin rsync \
              xz-utils file bc qemu-utils kpartx gpg pigz xxd arch-test \
              apt-cacher-ng
          sudo ln -sf /bin/true /usr/local/bin/qemu-arm

      # APT cache: apt-cacher-ng on the host runner serves debootstrap and every
      # in-chroot apt-get install over localhost. Pi-gen's stage0/00-configure-apt
      # writes /etc/apt/apt.conf.d/51cache (Acquire::http::Proxy = $APT_PROXY) into
      # the chroot, and export-image/02-set-sources removes that file before the
      # image is finalized — so the shipped /etc/apt has no proxy reference even
      # though the final dist-upgrade still inherits http_proxy from the build env.
      #
      # Cache key uses run_id to force a save every run (GitHub cache entries are
      # immutable per key); restore-keys walk back from "same package set" to
      # "any prior arm64 run" so we get the warmest available start. Restore runs
      # after the package install so the target dir already exists; pre-chown to
      # the runner is needed because actions/cache writes as the unprivileged user.
      - name: Pre-restore APT cache permissions
        run: sudo chown -R "$(id -u):$(id -g)" /var/cache/apt-cacher-ng

      - name: Restore APT cache
        id: apt-cache-restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /var/cache/apt-cacher-ng
          key: apt-cacher-ng-${{ matrix.arch }}-${{ hashFiles('**/*packages*', 'config-dev', 'config-stable', 'stage0/00-configure-apt/files/**', 'depends') }}-${{ github.run_id }}
          restore-keys: |
            apt-cacher-ng-${{ matrix.arch }}-${{ hashFiles('**/*packages*', 'config-dev', 'config-stable', 'stage0/00-configure-apt/files/**', 'depends') }}-
            apt-cacher-ng-${{ matrix.arch }}-

      - name: Start apt-cacher-ng
        run: |
          set -euo pipefail
          echo "cache restore hit: ${{ steps.apt-cache-restore.outputs.cache-hit || 'false' }}"
          # Bind localhost only — chroot shares the host network namespace and
          # can still reach 127.0.0.1, so we don't need to expose the proxy.
          # Append to acng.conf (Ubuntu's apt-cacher-ng has no conf.d drop-in dir);
          # apt-cacher-ng takes the last BindAddress directive wins.
          echo 'BindAddress: 127.0.0.1' | sudo tee -a /etc/apt-cacher-ng/acng.conf > /dev/null
          sudo chown -R apt-cacher-ng:apt-cacher-ng /var/cache/apt-cacher-ng
          # restart, not start: the package post-install enables and starts the
          # service before we got a chance to write the bind override.
          sudo systemctl restart apt-cacher-ng
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3142/acng-report.html > /dev/null; then
              echo "apt-cacher-ng ready"
              exit 0
            fi
            sleep 1
          done
          echo "apt-cacher-ng failed to come up within 30s" >&2
          sudo systemctl status apt-cacher-ng --no-pager >&2 || true
          exit 1

      - name: Build
        env:
          ARCH: ${{ matrix.arch }}
          IMG_NAME: airplanes-feeder-${{ env.CHANNEL }}-${{ matrix.arch }}
          ARCHIVE_FILENAME: airplanes-feeder-${{ env.CHANNEL }}-${{ matrix.arch }}
          DEPLOY_COMPRESSION: xz
          IMG_SUFFIX: ""
          APT_PROXY: http://127.0.0.1:3142
        run: sudo -E ./build.sh -c "config-$CHANNEL"

      - name: Per-cell rootfs smoke
        env:
          AIRPLANES_IMAGE_PATH: deploy/airplanes-feeder-${{ env.CHANNEL }}-${{ matrix.arch }}.img.xz
          AIRPLANES_IMAGE_CONTRACT: new
        run: sudo -E bash feed/test/image-release-rootfs-smoke.sh

      - name: First-run chroot smoke
        run: sudo -E bash scripts/first-run-chroot-smoke.sh "deploy/airplanes-feeder-${{ env.CHANNEL }}-${{ matrix.arch }}.img.xz"

      # Stop daemon cleanly before reading the cache dir; flushes pending writes.
      # Hit/miss line is logged for cache-effectiveness tracking across runs.
      - name: Stop apt-cacher-ng and log stats
        if: always()
        run: |
          curl -sf "http://127.0.0.1:3142/acng-report.html" 2>/dev/null \
            | grep -E 'Hits|Misses|Cache size|Bytes transferred' \
            || echo "could not fetch acng stats"
          sudo systemctl stop apt-cacher-ng || true
          sudo chown -R "$(id -u):$(id -g)" /var/cache/apt-cacher-ng || true

      # Save only on the success path. Saving on always() can poison the cache
      # for future runs if the build failed mid-fetch and left partial files.
      - name: Save APT cache
        if: steps.apt-cache-restore.outputs.cache-primary-key != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /var/cache/apt-cacher-ng
          key: ${{ steps.apt-cache-restore.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ env.CHANNEL }}-${{ matrix.arch }}
          path: deploy/
          if-no-files-found: error

  cleanup-dev-artifacts:
    # Keep only the newest image-dev-arm64 artifact. Without this, every dev
    # push leaves a ~700MB artifact behind for the default 90-day retention,
    # piling up to hundreds of GB. Gated to canonical dev pushes so manual
    # workflow_dispatch runs (even with channel=dev) can't delete the latest.
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && success()
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Delete prior dev-channel artifacts, keep newest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Materialize the full list before deleting: --paginate runs --jq
          # per page, so without --slurp we'd keep the newest *per page* rather
          # than newest overall, and concurrent producer/consumer over a mutable
          # collection can skip pages mid-pagination.
          mapfile -t artifact_ids < <(
            gh api --paginate --slurp \
              "repos/$REPO/actions/artifacts?name=image-dev-arm64&per_page=100" \
              --jq 'map(.artifacts[]) | sort_by(.created_at) | reverse | .[1:] | .[].id'
          )
          for id in "${artifact_ids[@]}"; do
            [[ "$id" =~ ^[0-9]+$ ]] || { echo "Unexpected artifact id: $id" >&2; exit 1; }
            echo "Deleting artifact $id"
            gh api --method DELETE "repos/$REPO/actions/artifacts/$id"
          done
