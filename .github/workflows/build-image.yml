name: build-image

# Triggers:
#   workflow_dispatch — manual; --ref selects branch. Use this to validate a
#       feature branch / PR before merging:
#         gh workflow run build-image.yml -R airplanes-live/image \
#             -f channel=dev --ref <pr-branch>
#   push to dev — post-merge validation. Every merge to dev rebuilds.
#   push to a stable/v* tag — release build with channel=stable. Cut a tag
#       on main: `git tag stable/v0.1.0 && git push origin stable/v0.1.0`.

on:
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        options: [stable, dev]
        default: dev
  push:
    # Heavy run on both dev (CHANNEL=dev, branch-tracking pins) and main
    # (CHANNEL=stable, the same SHAs the next stable release would publish).
    # stable/v* tag pushes still produce the actual release artifact via the
    # same build path. Having a green run on the main commit lets tag
    # rulesets gate `stable/v*` tag creation on prior CI status.
    branches: [dev, main]
    tags: ['stable/v*']

permissions:
  contents: read

jobs:
  build:
    name: build-${{ github.event.inputs.channel || ((startsWith(github.ref, 'refs/tags/stable/') || github.ref == 'refs/heads/main') && 'stable') || 'dev' }}-${{ matrix.arch }}
    strategy:
      matrix:
        # armhf code paths exist but firmware package set has not been
        # adapted for dual-arch yet; keep the matrix at arm64 until a
        # follow-up step adds armhf-specific firmware/kernel handling.
        arch: [arm64]
      fail-fast: false
    concurrency:
      group: image-build-${{ github.event.inputs.channel || ((startsWith(github.ref, 'refs/tags/stable/') || github.ref == 'refs/heads/main') && 'stable') || 'dev' }}-${{ matrix.arch }}-${{ github.ref }}
      cancel-in-progress: true
    # Native arm64 runner: host arch matches our target arch, so the entire
    # pi-gen build runs without qemu-user-aarch64 emulation. Eliminates the
    # ~5-10x emulation overhead on stage-airplanes/02-install-decoder (readsb +
    # dump978 compiles), where the bulk of build time used to live. Free for
    # public repos on free-plan orgs as of GitHub's Jan 2025 announcement.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    env:
      CHANNEL: ${{ github.event.inputs.channel || ((startsWith(github.ref, 'refs/tags/stable/') || github.ref == 'refs/heads/main') && 'stable') || 'dev' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Load channel config
        run: |
          set -a
          # shellcheck disable=SC1090
          source "config-$CHANNEL"
          set +a
          {
            echo "AIRPLANES_FEED_REPO=$AIRPLANES_FEED_REPO"
            echo "AIRPLANES_FEED_BRANCH=$AIRPLANES_FEED_BRANCH"
            echo "AIRPLANES_READSB_REPO=$AIRPLANES_READSB_REPO"
            echo "AIRPLANES_READSB_BRANCH=$AIRPLANES_READSB_BRANCH"
            echo "CHANNEL=$CHANNEL"
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: airplanes-live/feed
          ref: ${{ env.AIRPLANES_FEED_BRANCH }}
          path: feed

      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af || true

      - name: Install pi-gen build dependencies
        run: |
          sudo apt-get update
          # Native arm64 runner: no qemu-user emulation needed for arm64 target.
          # pi-gen's `depends` file still requires the bare `qemu-arm` command
          # to exist (line 4: qemu-arm:qemu-user-binfmt) — its dependencies_check
          # only does `hash qemu-arm`, never invokes it. Satisfy the check with
          # a /bin/true shim instead of pulling qemu-user-binfmt onto the host.
          sudo apt-get install -y --no-install-recommends \
              quilt parted debootstrap \
              zerofree zip dosfstools libarchive-tools libcap2-bin rsync \
              xz-utils file bc qemu-utils kpartx gpg pigz xxd arch-test
          sudo ln -sf /bin/true /usr/local/bin/qemu-arm

      - name: Build
        env:
          ARCH: ${{ matrix.arch }}
          IMG_NAME: airplanes-feeder-${{ env.CHANNEL }}-${{ matrix.arch }}
          ARCHIVE_FILENAME: airplanes-feeder-${{ env.CHANNEL }}-${{ matrix.arch }}
          DEPLOY_COMPRESSION: xz
          IMG_SUFFIX: ""
        run: sudo -E ./build.sh -c "config-$CHANNEL"

      - name: Mounted-image upgrade smoke
        env:
          AIRPLANES_IMAGE_PATH: deploy/airplanes-feeder-${{ env.CHANNEL }}-${{ matrix.arch }}.img.xz
          AIRPLANES_IMAGE_CONTRACT: new
        run: sudo -E bash feed/test/mounted-image-upgrade.sh

      - name: First-run chroot smoke
        run: sudo -E bash scripts/first-run-chroot-smoke.sh "deploy/airplanes-feeder-${{ env.CHANNEL }}-${{ matrix.arch }}.img.xz"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ env.CHANNEL }}-${{ matrix.arch }}
          path: deploy/
          if-no-files-found: error

  boot-smoke:
    # End-to-end boot of the just-built image under QEMU on a native arm64
    # runner. Reuses feed/test/image-boot.sh for the QEMU launch + service
    # health probes + feed-update idempotency; image-specific assertions
    # (boot-config apply state, lighttpd, webconfig HTTP, sshd) ride along
    # via test/boot-smoke/extra-probe.sh, sourced post-reboot through the
    # AIRPLANES_BOOT_SMOKE_EXTRA_SETUP hook on image-boot.sh.
    needs: build
    name: boot-smoke-${{ github.event.inputs.channel || ((startsWith(github.ref, 'refs/tags/stable/') || github.ref == 'refs/heads/main') && 'stable') || 'dev' }}-${{ matrix.arch }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    strategy:
      matrix:
        arch: [arm64]
      fail-fast: false
    env:
      CHANNEL: ${{ github.event.inputs.channel || ((startsWith(github.ref, 'refs/tags/stable/') || github.ref == 'refs/heads/main') && 'stable') || 'dev' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Load channel config
        run: |
          set -a
          # shellcheck disable=SC1090
          source "config-$CHANNEL"
          set +a
          echo "AIRPLANES_FEED_BRANCH=$AIRPLANES_FEED_BRANCH" >> "$GITHUB_ENV"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: airplanes-live/feed
          ref: ${{ env.AIRPLANES_FEED_BRANCH }}
          path: feed

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-${{ env.CHANNEL }}-${{ matrix.arch }}
          path: deploy

      - name: Install QEMU smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            binutils \
            cpio \
            curl \
            gh \
            initramfs-tools-core \
            git \
            jq \
            kmod \
            parted \
            p7zip-full \
            qemu-system-arm \
            qemu-user-static \
            rsync \
            file \
            unzip \
            xz-utils \
            zstd

      - name: Run image boot smoke
        env:
          GH_TOKEN: ${{ github.token }}
          AIRPLANES_IMAGE_PATH: ${{ github.workspace }}/deploy/airplanes-feeder-${{ env.CHANNEL }}-${{ matrix.arch }}.img.xz
          AIRPLANES_IMAGE_CONTRACT: new
          AIRPLANES_IMAGE_CHANNEL: ${{ env.CHANNEL }}
          AIRPLANES_IMAGE_ARCH: ${{ matrix.arch }}
          AIRPLANES_BOOT_SMOKE_EXTRA_SETUP: ${{ github.workspace }}/test/boot-smoke/setup.sh
          AIRPLANES_BOOT_SMOKE_WORK_DIR: ${{ runner.temp }}/airplanes-image-boot
          # Preserve qemu-logs across the cleanup trap so the failure-artifact
          # upload step below can read them.
          AIRPLANES_BOOT_SMOKE_KEEP_WORK_DIR: '1'
        run: |
          sudo --preserve-env=GH_TOKEN,AIRPLANES_IMAGE_PATH,AIRPLANES_IMAGE_CONTRACT,AIRPLANES_IMAGE_CHANNEL,AIRPLANES_IMAGE_ARCH,AIRPLANES_BOOT_SMOKE_EXTRA_SETUP,AIRPLANES_BOOT_SMOKE_WORK_DIR,AIRPLANES_BOOT_SMOKE_KEEP_WORK_DIR \
            bash feed/test/image-boot.sh

      - name: Upload QEMU logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: boot-smoke-${{ env.CHANNEL }}-${{ matrix.arch }}-logs
          path: ${{ runner.temp }}/airplanes-image-boot/qemu-logs
          if-no-files-found: warn

  webconfig-upgrade-qemu:
    # End-to-end QEMU upgrade test: boots the built image, triggers
    # /api/webconfig-update twice against synthetic file:// releases, expects
    # convergence on Phase A and rollback on Phase B, then reboots and
    # verifies the rolled-back state persists. Distinct from boot-smoke —
    # they share an image build but not a VM boot.
    needs: build
    name: webconfig-upgrade-qemu-${{ github.event.inputs.channel || ((startsWith(github.ref, 'refs/tags/stable/') || github.ref == 'refs/heads/main') && 'stable') || 'dev' }}-${{ matrix.arch }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    strategy:
      matrix:
        arch: [arm64]
      fail-fast: false
    env:
      CHANNEL: ${{ github.event.inputs.channel || ((startsWith(github.ref, 'refs/tags/stable/') || github.ref == 'refs/heads/main') && 'stable') || 'dev' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Load channel config
        run: |
          set -a
          # shellcheck disable=SC1090
          source "config-$CHANNEL"
          set +a
          echo "AIRPLANES_FEED_BRANCH=$AIRPLANES_FEED_BRANCH" >> "$GITHUB_ENV"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: airplanes-live/feed
          ref: ${{ env.AIRPLANES_FEED_BRANCH }}
          path: feed

      # The image's BAKED webconfig ships from config-${CHANNEL}'s pin — stage
      # 05 inside the booted VM downloads that. The sibling checkout below is
      # the BUILDER of the synthetic newer release we upgrade to; it needs
      # scripts/lib/build-release.sh, which only exists on dev (the release
      # packager was extracted after the last stable tag was cut). Pin the
      # sibling at dev so the test always picks up the current packager.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: airplanes-live/image-webconfig
          ref: dev
          path: image-webconfig

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: image-webconfig/go.mod

      - name: Pre-build synthetic release payloads (good + broken)
        # Build the synthetic releases here, on the runner user where setup-go
        # put `go` on PATH. The boot-smoke step below runs under sudo, and
        # sudo's secure_path strips $PATH, so `go build` is not reachable
        # from inside setup.sh. setup.sh copies the prebuilt dir into the
        # rootfs.
        env:
          PREBUILT_DIR: ${{ runner.temp }}/webconfig-prebuilt
          WEBCONFIG_SRC: ${{ github.workspace }}/image-webconfig
        run: |
          # shellcheck source=test/boot-smoke/lib/webconfig-upgrade-helpers.sh
          . test/boot-smoke/lib/webconfig-upgrade-helpers.sh
          build_synthetic_releases_prebuild "$WEBCONFIG_SRC" "$PREBUILT_DIR" "$CHANNEL"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-${{ env.CHANNEL }}-${{ matrix.arch }}
          path: deploy

      - name: Install QEMU smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            binutils \
            cpio \
            curl \
            gh \
            initramfs-tools-core \
            git \
            jq \
            kmod \
            parted \
            p7zip-full \
            qemu-system-arm \
            qemu-user-static \
            rsync \
            file \
            unzip \
            xz-utils \
            zstd

      - name: Run image boot smoke (webconfig-upgrade variant)
        env:
          GH_TOKEN: ${{ github.token }}
          AIRPLANES_IMAGE_PATH: ${{ github.workspace }}/deploy/airplanes-feeder-${{ env.CHANNEL }}-${{ matrix.arch }}.img.xz
          AIRPLANES_IMAGE_CONTRACT: new
          AIRPLANES_IMAGE_CHANNEL: ${{ env.CHANNEL }}
          AIRPLANES_IMAGE_ARCH: ${{ matrix.arch }}
          AIRPLANES_BOOT_SMOKE_EXTRA_SETUP: ${{ github.workspace }}/test/boot-smoke/setup.sh
          AIRPLANES_BOOT_SMOKE_WORK_DIR: ${{ runner.temp }}/airplanes-image-boot-upgrade
          AIRPLANES_BOOT_SMOKE_KEEP_WORK_DIR: '1'
          AIRPLANES_BOOT_SMOKE_TEST_WEBCONFIG_UPGRADE: '1'
          AIRPLANES_BOOT_SMOKE_PREBUILT_RELEASES: ${{ runner.temp }}/webconfig-prebuilt
          # Probe phase model: initial boot runs feed update + reboot;
          # 'updated' boot runs phase A+B then reboots; third boot runs
          # the reboot-persistence check then poweroffs. image-boot.sh
          # defaults to 2 host-side boot attempts; bump to 3 for this job.
          AIRPLANES_BOOT_SMOKE_MAX_BOOT_ATTEMPTS: '3'
        run: |
          sudo --preserve-env=GH_TOKEN,AIRPLANES_IMAGE_PATH,AIRPLANES_IMAGE_CONTRACT,AIRPLANES_IMAGE_CHANNEL,AIRPLANES_IMAGE_ARCH,AIRPLANES_BOOT_SMOKE_EXTRA_SETUP,AIRPLANES_BOOT_SMOKE_WORK_DIR,AIRPLANES_BOOT_SMOKE_KEEP_WORK_DIR,AIRPLANES_BOOT_SMOKE_TEST_WEBCONFIG_UPGRADE,AIRPLANES_BOOT_SMOKE_PREBUILT_RELEASES,AIRPLANES_BOOT_SMOKE_MAX_BOOT_ATTEMPTS \
            bash feed/test/image-boot.sh

      - name: Upload QEMU logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webconfig-upgrade-qemu-${{ env.CHANNEL }}-${{ matrix.arch }}-logs
          path: ${{ runner.temp }}/airplanes-image-boot-upgrade/qemu-logs
          if-no-files-found: warn

  publish-dev-latest:
    # Maintain a single rolling `dev-latest` GitHub prerelease that always
    # points at the most recent successful push-to-dev build. Downstream
    # consumers (feed/ CI's mounted-image-smoke-new and image-boot-smoke
    # `new` matrix cell) resolve the latest dev image via this prerelease
    # rather than the workflow-artifact API; releases don't expire, so the
    # 90-day artifact retention window is no longer a coverage concern.
    name: Update rolling dev-latest prerelease
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && success()
    runs-on: ubuntu-24.04
    permissions:
      # Scoped to this job only — the `build` job stays at the workflow-level
      # `contents: read`. Keeps the long-running build chroot (which runs
      # third-party pi-gen stages and downloaded readsb/feed sources) from
      # holding write permissions to the repo's contents.
      contents: write
    concurrency:
      # Serialize concurrent dev pushes' publish steps. cancel-in-progress
      # is false so a second dev push doesn't tear an in-flight `--clobber`
      # upload from a still-running first publish.
      group: dev-latest-release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      # Need scripts/make-imager-manifest.sh available locally — it generates
      # the rpi-imager Custom Repository sidecar that gets uploaded alongside
      # the .img.xz. No submodules / no LFS, so a shallow checkout is enough.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-dev-arm64
          path: deploy

      - name: Upsert dev-latest prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(deploy/airplanes-feeder-dev-*.img.xz)
          shopt -u nullglob
          if (( ${#assets[@]} != 1 )); then
              echo "expected exactly 1 airplanes-feeder-dev-*.img.xz under deploy/, found ${#assets[@]}" >&2
              ls -la deploy/ >&2 || true
              exit 1
          fi
          asset="${assets[0]}"
          asset_basename="$(basename -- "$asset")"
          short_sha="${SHA:0:12}"

          # Stage an immutable per-run copy of the .img.xz keyed on commit
          # SHA + workflow run id + attempt number. The rpi-imager manifest's
          # `url` field references this asset, so its extract_sha256 can
          # never go stale relative to the bytes rpi-imager downloads.
          # RUN_ID + RUN_ATTEMPT means same-SHA re-runs never collide on an
          # asset name, so we never have to --clobber an immutable URL that
          # a previously-published manifest may still reference. Older
          # immutable copies are pruned below.
          immutable_basename="${asset_basename%.img.xz}-${short_sha}-r${RUN_ID}-a${RUN_ATTEMPT}.img.xz"
          immutable_path="$(dirname -- "$asset")/$immutable_basename"
          cp -f -- "$asset" "$immutable_path"

          # extract_sha256 in the manifest comes from the local .img.xz
          # bytes — those bytes are identical in $asset and $immutable_path
          # (same cp source), so running the generator against $asset and
          # overriding only `url` is correct.
          immutable_url="https://github.com/$GITHUB_REPOSITORY/releases/download/dev-latest/$immutable_basename"
          # Build identity for the rpi-imager OS-list entry. $SHA is the full
          # 40-char github.sha; the script slices to 12 chars internally to
          # match $short_sha above. build_time uses publish-job run time at
          # second precision so the name (HH:MMZ) plus the description
          # (HH:MM:SS UTC) disambiguate same-day and same-minute reruns.
          build_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          scripts/make-imager-manifest.sh \
              --image-url "$immutable_url" \
              --commit-sha "$SHA" \
              --build-time "$build_time" \
              "$asset"
          manifest="${asset%.img.xz}.rpi-imager-manifest.json"
          if [[ ! -f "$manifest" ]]; then
              echo "manifest not produced at expected path: $manifest" >&2
              exit 1
          fi

          notes="Updated automatically on every push to dev. Overwritten in place; not a per-build release. For stable builds, see release tags.

          Built from $GITHUB_REPOSITORY @ ${SHA}."

          # Ensure the release exists before any asset upload. gh release
          # upload fails with "release not found" for the first ever push;
          # create an empty release first so the rest of the flow is the
          # same regardless of first-vs-existing. The workflow's concurrency
          # group serializes publish-dev-latest invocations for this repo,
          # so the view-then-create sequence is race-free here.
          if ! gh release view dev-latest -R "$GITHUB_REPOSITORY" --json id >/dev/null 2>&1; then
              gh release create dev-latest --prerelease \
                  --title "Bleeding-edge dev build (rolling)" \
                  --notes "$notes" \
                  -R "$GITHUB_REPOSITORY"
          fi

          # Sequential single-asset uploads. gh release upload defaults to
          # 5 concurrent goroutines when handed multiple files in one call,
          # so passing them together does not guarantee the immutable .xz
          # lands before the manifest. Splitting into separate invocations
          # and relying on `set -e` for ordering ensures rpi-imager never
          # sees a manifest whose `url` points at a not-yet-uploaded asset.
          #   1. Immutable .img.xz under a per-run unique name (no
          #      --clobber: name cannot collide with an existing asset).
          #   2. Manifest with --clobber. This is the "commit": clients see
          #      the swap from old→new the moment this small file is
          #      replaced. The previous manifest still references the
          #      previous immutable .xz, which the pruner keeps around so
          #      in-flight rpi-imager downloads against the old manifest
          #      still complete.
          gh release upload dev-latest "$immutable_path" -R "$GITHUB_REPOSITORY"
          gh release upload dev-latest "$manifest" --clobber -R "$GITHUB_REPOSITORY"
          # Refresh body to reflect the SHA whose assets we just uploaded.
          gh release edit dev-latest --notes "$notes" -R "$GITHUB_REPOSITORY"

          # One-time cleanup: delete the rolling-name .img.xz asset left
          # behind by the previous publish flow. feed/test/lib/image-source.sh
          # now resolves via the manifest's `url` field (which always points
          # at the immutable asset), so no internal consumer needs the
          # rolling name. The block is idempotent: subsequent runs find no
          # rolling-name asset and the conditional below is skipped.
          #
          # Channel is hardcoded `dev` to match this job's filename glob
          # (`deploy/airplanes-feeder-dev-*.img.xz` above) — the `build`
          # job's `CHANNEL` env var doesn't propagate into this job.
          rolling_name="airplanes-feeder-dev-arm64.img.xz"
          rolling_url="$(
              gh release view dev-latest -R "$GITHUB_REPOSITORY" --json assets \
                  | jq -r --arg name "$rolling_name" \
                      '[.assets[]? | select(.name == $name)] | first | .apiUrl // empty'
          )"
          if [[ -n "$rolling_url" ]]; then
              if [[ "$rolling_url" != https://api.github.com/repos/*/releases/assets/* ]]; then
                  echo "unexpected rolling-asset api URL: $rolling_url" >&2
                  exit 1
              fi
              echo "deleting stale rolling-name asset: $rolling_url"
              gh api --method DELETE "$rolling_url"
          fi

          # Prune older immutable .img.xz copies. Keep only the
          # just-uploaded one; everything else goes. This is a bleeding-edge
          # channel — the README is explicit that flashing tracks the
          # latest cut and to expect occasional reflashes. An rpi-imager
          # session that straddles a publish may hit a 404 on the old
          # immutable URL it cached, and the user reties; that matches the
          # contract and saves ~800 MB of release storage per kept copy.
          # The just-uploaded asset sorts first by createdAt and is
          # therefore preserved.
          mapfile -t old_asset_urls < <(
              gh release view dev-latest -R "$GITHUB_REPOSITORY" --json assets \
                  --jq '.assets
                        | map(select(.name | test("^airplanes-feeder-dev-[a-z0-9]+-[a-f0-9]{7,}-r[0-9]+-a[0-9]+\\.img\\.xz$")))
                        | sort_by(.createdAt) | reverse | .[1:] | .[].apiUrl'
          )
          for asset_url in "${old_asset_urls[@]}"; do
              # Guard against jq returning something unexpected. Only delete
              # URLs that look like the release-assets API endpoint.
              if [[ "$asset_url" != https://api.github.com/repos/*/releases/assets/* ]]; then
                  echo "skipping unexpected asset URL: $asset_url" >&2
                  continue
              fi
              echo "deleting old immutable asset: $asset_url"
              gh api --method DELETE "$asset_url"
          done

  cleanup-dev-artifacts:
    # Keep only the newest image-dev-arm64 artifact. Without this, every dev
    # push leaves a ~700MB artifact behind for the default 90-day retention,
    # piling up to hundreds of GB. Gated to canonical dev pushes so manual
    # workflow_dispatch runs (even with channel=dev) can't delete the latest.
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && success()
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Delete prior dev-channel artifacts, keep newest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Materialize the full list before deleting: --paginate runs --jq
          # per page, so without --slurp we'd keep the newest *per page* rather
          # than newest overall, and concurrent producer/consumer over a mutable
          # collection can skip pages mid-pagination.
          mapfile -t artifact_ids < <(
            gh api --paginate --slurp \
              "repos/$REPO/actions/artifacts?name=image-dev-arm64&per_page=100" \
              --jq 'map(.artifacts[]) | sort_by(.created_at) | reverse | .[1:] | .[].id'
          )
          for id in "${artifact_ids[@]}"; do
            [[ "$id" =~ ^[0-9]+$ ]] || { echo "Unexpected artifact id: $id" >&2; exit 1; }
            echo "Deleting artifact $id"
            gh api --method DELETE "repos/$REPO/actions/artifacts/$id"
          done
