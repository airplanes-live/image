name: ci

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  shell-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck

      - name: shellcheck
        run: |
          shopt -s globstar nullglob
          mapfile -d '' files < <(
            find scripts stage-airplanes test runtime-overlay -type f \
              \( -name '*.sh' \
                 -o -name 'systemctl-stub' \
                 -o -name 'airplanes-first-run' \
                 -o -name 'airplanes-grant-sudo' \
                 -o -name 'render-status' \
                 -o -name '10-airplanes-status' \
                 -o -name '09-airplanes-recovery-status' \
                 -o -name 'recover-shim' \
                 -o -name 'airplanes-update-orchestrator' \) \
              -print0
          )
          if (( ${#files[@]} == 0 )); then
            echo "no scripts to check" >&2
            exit 1
          fi
          shellcheck "${files[@]}"

      - name: bash -n
        run: |
          shopt -s globstar nullglob
          for f in scripts/systemctl-stub scripts/*.sh \
                   stage-airplanes/**/*.sh \
                   stage-airplanes/**/files/**/airplanes-first-run \
                   stage-airplanes/**/files/**/airplanes-grant-sudo \
                   runtime-overlay/src/lib/airplanes/render-status \
                   runtime-overlay/src/lib/airplanes-update-orchestrator \
                   runtime-overlay/src/lib/*.sh \
                   runtime-overlay/scripts/gates/*.sh \
                   runtime-overlay/scripts/release-workflow/*.sh \
                   runtime-overlay/src/etc/update-motd.d/10-airplanes-status \
                   runtime-overlay/src/share/airplanes/*.sh \
                   stage-airplanes/02-install-runtime-overlay/files/usr/local/lib/airplanes-runtime/recover-shim \
                   stage-airplanes/02-install-runtime-overlay/files/etc/update-motd.d/09-airplanes-recovery-status \
                   test/*.sh; do
            [[ -e "$f" ]] || continue
            bash -n "$f"
          done

      - name: No nested on_chroot in *-run-chroot.sh
        run: |
          # pi-gen's build.sh already invokes each *-run-chroot.sh via
          # `on_chroot < script.sh`, so the body executes inside the chroot
          # where on_chroot is undefined. A nested call silently broke the
          # 06b stage in PR #29; this guard prevents a repeat. Anchored at
          # line-start so docstring mentions don't trip it.
          shopt -s globstar nullglob
          if grep -nE '^[[:space:]]*on_chroot([[:space:]<;]|$)' \
               stage-airplanes/**/*-run-chroot.sh; then
            echo "*-run-chroot.sh files are already executed via on_chroot by pi-gen build.sh" >&2
            exit 1
          fi

  shell-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Resolve image-webconfig ref from config-stable
        id: webconfig-ref
        # config-stable pins the production ref. Test against that so a
        # mismatch between what the stable image will install and what the
        # CI tests blow up here, not on a customer device.
        run: |
          set -a
          # shellcheck disable=SC1091
          . config-stable
          set +a
          echo "ref=$AIRPLANES_WEBCONFIG_BRANCH" >> "$GITHUB_OUTPUT"

      # Several first-run bats tests source wifi-validators.sh /
      # wifi-keyfile.sh from airplanes-live/image-webconfig (the libs moved
      # there with the webconfig extraction). Co-locate the checkout
      # alongside the image repo and tell bats where to find it via
      # AIRPLANES_IMAGE_WEBCONFIG_ROOT.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: airplanes-live/image-webconfig
          ref: ${{ steps.webconfig-ref.outputs.ref }}
          path: image-webconfig-sibling

      - name: Install bats and manifest-validator deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bats jq python3-jsonschema

      # Snapshot host state so the post-bats step can fail loudly if the
      # tests mutated the runner. The historical instance was apply_hostname
      # calling `hostnamectl set-hostname` against the live D-Bus during
      # local `bats test/` runs — fixed by test/lib/host-runtime-stubs.sh,
      # but stub coverage is a moving target. This snapshot-and-diff is a
      # broader safety net that catches any future leak from a command we
      # haven't thought to stub yet.
      - name: Snapshot host state (pre-bats)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/host-state-pre"
          cp /etc/hostname "$RUNNER_TEMP/host-state-pre/hostname"
          cp /etc/hosts "$RUNNER_TEMP/host-state-pre/hosts"
          # /etc/wpa_supplicant/ may not exist on a fresh ubuntu-24.04 runner.
          if [ -d /etc/wpa_supplicant ]; then
            ls -laR /etc/wpa_supplicant > "$RUNNER_TEMP/host-state-pre/wpa-listing"
          else
            echo absent > "$RUNNER_TEMP/host-state-pre/wpa-listing"
          fi

      - name: bats test/
        env:
          AIRPLANES_IMAGE_WEBCONFIG_ROOT: ${{ github.workspace }}/image-webconfig-sibling
        run: bats -r test/

      - name: Verify host state untouched (post-bats)
        if: always()
        run: |
          set -euo pipefail
          fail=0
          if ! diff -u "$RUNNER_TEMP/host-state-pre/hostname" /etc/hostname; then
            echo "::error::/etc/hostname was mutated during bats test/ — a stub is missing in test/lib/host-runtime-stubs.sh"
            fail=1
          fi
          if ! diff -u "$RUNNER_TEMP/host-state-pre/hosts" /etc/hosts; then
            echo "::error::/etc/hosts was mutated during bats test/ — a stub is missing in test/lib/host-runtime-stubs.sh"
            fail=1
          fi
          actual_wpa="absent"
          if [ -d /etc/wpa_supplicant ]; then
            actual_wpa="$(ls -laR /etc/wpa_supplicant)"
          fi
          if ! diff -u "$RUNNER_TEMP/host-state-pre/wpa-listing" <(printf '%s\n' "$actual_wpa"); then
            echo "::error::/etc/wpa_supplicant/ was mutated during bats test/ — a stub is missing in test/lib/host-runtime-stubs.sh"
            fail=1
          fi
          exit "$fail"

  # Real-systemd smoke for airplanes-first-run.service. Installs the unit
  # and the script onto the runner, runs the unit via systemctl, and asserts
  # the consume-and-rename + error-file outcomes. This is the dynamic
  # counterpart to test/test_first_run_unit.bats (static lint) — catches
  # any future regression where the unit-file directives drift away from
  # what the script actually writes (e.g. a ProtectSystem= re-mount that
  # silently locks /etc, which chroot tests cannot see).
  #
  # feeder-id is pre-seeded so generate_feeder_id no-ops — that lets us
  # skip the feed/ checkout (create-uuid.sh is exercised separately by the
  # feed repo's CI). The runner is ephemeral, so /etc / /boot/firmware /
  # /run/airplanes state created here is discarded with the VM.
  first-run-systemd:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install unit + script onto runner
        run: |
          sudo install -m 0755 \
            stage-airplanes/06-firstboot/files/usr/local/sbin/airplanes-first-run \
            /usr/local/sbin/
          sudo install -m 0644 \
            stage-airplanes/06-firstboot/files/etc/systemd/system/airplanes-first-run.service \
            /etc/systemd/system/
          sudo install -d -m 0755 /etc/airplanes
          # Pre-seed feeder-id so generate_feeder_id no-ops (covered separately
          # by feed's CI; here we only care about the consume-rename behaviour
          # under real systemd sandboxing).
          printf '00000000-0000-0000-0000-000000000000\n' \
            | sudo tee /etc/airplanes/feeder-id >/dev/null
          sudo install -d -m 0755 /boot/firmware
          # Every path in the unit's ReadWritePaths= must exist on disk before
          # the unit starts — otherwise systemd fails the mount-namespace setup
          # with status=226/NAMESPACE. On the real image, /usr/local/share/airplanes
          # is created by stage-airplanes/01-install-feed; here we have to
          # materialise it ourselves.
          sudo install -d -m 0755 /usr/local/share/airplanes
          # apply_hostname rewrites the /etc/hosts 127.0.1.1 line whose
          # hostname matches /etc/hostname's current value. GitHub-hosted
          # runners don't always have a 127.0.1.1 entry that matches, so
          # set a known baseline (clean hostname + matching /etc/hosts line)
          # before starting the unit.
          echo 'ci-runner-baseline' | sudo tee /etc/hostname >/dev/null
          sudo sh -c "grep -v '^127\\.0\\.1\\.1' /etc/hosts > /etc/hosts.new || true; mv /etc/hosts.new /etc/hosts"
          echo '127.0.1.1 ci-runner-baseline' | sudo tee -a /etc/hosts >/dev/null
          sudo systemctl daemon-reload

      - name: Happy path — apply succeeds, source renamed to .applied.txt
        run: |
          # HOSTNAME exercises the hostnamectl path under the unit's sandbox
          # (CapabilityBoundingSet= empty + RestrictAddressFamilies=AF_UNIX +
          # PrivateNetwork=yes): the script's primary apply path calls
          # hostnamectl, which D-Buses systemd-hostnamed via AF_UNIX. This
          # also confirms /etc/hostname + /etc/hosts writes work — those are
          # the writes ProtectSystem=full would have silently locked.
          # FEED_HOST exercises expand_feed_host's MLATSERVER/TARGET synthesis
          # under the same sandbox.
          sudo tee /boot/firmware/airplanes-config.txt >/dev/null <<'CFG'
          HOSTNAME=airplanes-ci-smoke
          FEED_HOST=ci-backend.local
          CFG
          sudo systemctl start airplanes-first-run.service
          sudo systemctl status airplanes-first-run.service --no-pager

          [[ ! -f /boot/firmware/airplanes-config.txt ]] \
            || { echo "source not consumed"; exit 1; }
          [[ -f /boot/firmware/airplanes-config.applied.txt ]] \
            || { echo "applied.txt missing"; exit 1; }
          [[ ! -f /boot/firmware/airplanes-config.error.txt ]] \
            || { echo "unexpected error.txt"; sudo cat /boot/firmware/airplanes-config.error.txt; exit 1; }
          sudo grep -q '^MLATSERVER="ci-backend.local:31090"$' /etc/airplanes/feed.env \
            || { echo "MLATSERVER not derived from FEED_HOST"; sudo cat /etc/airplanes/feed.env; exit 1; }
          sudo grep -q '^TARGET="--net-connector ci-backend.local,30004,beast_reduce_plus_out"$' /etc/airplanes/feed.env \
            || { echo "TARGET not derived from FEED_HOST"; sudo cat /etc/airplanes/feed.env; exit 1; }
          [[ "$(sudo cat /etc/hostname | tr -d '\n\r')" = "airplanes-ci-smoke" ]] \
            || { echo "/etc/hostname not updated: got '$(sudo cat /etc/hostname)'"; exit 1; }
          sudo grep -qE '^127\.0\.1\.1[[:space:]]+airplanes-ci-smoke' /etc/hosts \
            || { echo "/etc/hosts 127.0.1.1 line not updated"; sudo cat /etc/hosts; exit 1; }
          # HOSTNAME and FEED_HOST are synthetic keys — must never reach feed.env.
          ! sudo grep -qE '^HOSTNAME=' /etc/airplanes/feed.env \
            || { echo "HOSTNAME leaked into feed.env"; exit 1; }
          ! sudo grep -qE '^FEED_HOST=' /etc/airplanes/feed.env \
            || { echo "FEED_HOST leaked into feed.env"; exit 1; }

      - name: Failure path — invalid HOSTNAME leaves source + writes .error.txt; valid key still applies
        run: |
          # Invalid HOSTNAME blocks the rename; a valid FEED_HOST alongside it
          # still gets its derived endpoints merged into feed.env (errors don't
          # prevent the merge — they only prevent the source-rename step).
          sudo tee /boot/firmware/airplanes-config.txt >/dev/null <<'CFG'
          HOSTNAME=foo.bar
          FEED_HOST=ci-failure-backend.local
          CFG
          sudo systemctl restart airplanes-first-run.service
          sudo systemctl status airplanes-first-run.service --no-pager

          [[ -f /boot/firmware/airplanes-config.txt ]] \
            || { echo "source missing after failure"; exit 1; }
          [[ -f /boot/firmware/airplanes-config.error.txt ]] \
            || { echo "error.txt missing"; exit 1; }
          sudo grep -qi 'HOSTNAME' /boot/firmware/airplanes-config.error.txt \
            || { echo "error.txt does not mention HOSTNAME"; sudo cat /boot/firmware/airplanes-config.error.txt; exit 1; }
          # The valid FEED_HOST in the same file should still have been merged
          # via expand_feed_host -> MLATSERVER + TARGET.
          sudo grep -q '^MLATSERVER="ci-failure-backend.local:31090"$' /etc/airplanes/feed.env \
            || { echo "MLATSERVER not merged from partial-error file"; sudo cat /etc/airplanes/feed.env; exit 1; }

      - name: WEBSITE_URL path — expand_website_url writes APL_FEED_WEBSITE_URL; key does not leak
        run: |
          # WEBSITE_URL is the non-prod website pointer (claim + diagnostics +
          # config-sync). expand_website_url renames the key to
          # APL_FEED_WEBSITE_URL on the way into feed.env; the source name
          # itself must never leak.
          sudo tee /boot/firmware/airplanes-config.txt >/dev/null <<'CFG'
          HOSTNAME=airplanes-ci-website
          WEBSITE_URL=http://ci-website.local
          CFG
          sudo systemctl restart airplanes-first-run.service
          sudo systemctl status airplanes-first-run.service --no-pager

          [[ ! -f /boot/firmware/airplanes-config.txt ]] \
            || { echo "source not consumed"; exit 1; }
          [[ -f /boot/firmware/airplanes-config.applied.txt ]] \
            || { echo "applied.txt missing"; exit 1; }
          [[ ! -f /boot/firmware/airplanes-config.error.txt ]] \
            || { echo "unexpected error.txt"; sudo cat /boot/firmware/airplanes-config.error.txt; exit 1; }
          sudo grep -q '^APL_FEED_WEBSITE_URL="http://ci-website.local"$' /etc/airplanes/feed.env \
            || { echo "APL_FEED_WEBSITE_URL not derived from WEBSITE_URL"; sudo cat /etc/airplanes/feed.env; exit 1; }
          # WEBSITE_URL is a synthetic key — must never reach feed.env.
          ! sudo grep -qE '^WEBSITE_URL=' /etc/airplanes/feed.env \
            || { echo "WEBSITE_URL leaked into feed.env"; exit 1; }

      - name: WEBSITE_URL rejection — invalid value blocks rename, writes .error.txt
        run: |
          # No scheme → reject. expand_website_url records the error; the
          # rename to .applied.txt is gated on BOOT_CFG_ERRORS being empty.
          # The preceding "WEBSITE_URL path" step left a valid APL_FEED_WEBSITE_URL
          # in feed.env; this step must NOT overwrite it from a rejected input.
          sudo tee /boot/firmware/airplanes-config.txt >/dev/null <<'CFG'
          HOSTNAME=airplanes-ci-website-bad
          WEBSITE_URL=not-a-url
          CFG
          sudo systemctl restart airplanes-first-run.service
          sudo systemctl status airplanes-first-run.service --no-pager

          [[ -f /boot/firmware/airplanes-config.txt ]] \
            || { echo "source missing after invalid-URL rejection"; exit 1; }
          [[ -f /boot/firmware/airplanes-config.error.txt ]] \
            || { echo "error.txt missing"; exit 1; }
          sudo grep -q 'WEBSITE_URL' /boot/firmware/airplanes-config.error.txt \
            || { echo "error.txt does not mention WEBSITE_URL"; sudo cat /boot/firmware/airplanes-config.error.txt; exit 1; }
          ! sudo grep -qE '^WEBSITE_URL=' /etc/airplanes/feed.env \
            || { echo "WEBSITE_URL leaked into feed.env despite rejection"; exit 1; }
          # Prior valid value (set by the previous step) must persist — the
          # rejected input must not bake "not-a-url" into APL_FEED_WEBSITE_URL.
          sudo grep -q '^APL_FEED_WEBSITE_URL="http://ci-website.local"$' /etc/airplanes/feed.env \
            || { echo "prior APL_FEED_WEBSITE_URL clobbered by rejected input"; sudo cat /etc/airplanes/feed.env; exit 1; }
          ! sudo grep -qE 'not-a-url' /etc/airplanes/feed.env \
            || { echo "rejected WEBSITE_URL value reached feed.env"; sudo cat /etc/airplanes/feed.env; exit 1; }

      - name: Allowlist path — non-bootstrap key is rejected with category-specific message
        run: |
          # LATITUDE is webconfig-writable; the parser must reject it at parse
          # time with a 'webconfig UI' pointer rather than silently dropping it
          # or letting it reach feed.env.
          sudo tee /boot/firmware/airplanes-config.txt >/dev/null <<'CFG'
          HOSTNAME=airplanes-ci-allowlist
          LATITUDE=51.5
          CFG
          sudo systemctl restart airplanes-first-run.service
          sudo systemctl status airplanes-first-run.service --no-pager

          [[ -f /boot/firmware/airplanes-config.txt ]] \
            || { echo "source missing after allowlist rejection"; exit 1; }
          [[ -f /boot/firmware/airplanes-config.error.txt ]] \
            || { echo "error.txt missing"; exit 1; }
          sudo grep -q 'LATITUDE' /boot/firmware/airplanes-config.error.txt \
            || { echo "error.txt does not mention LATITUDE"; sudo cat /boot/firmware/airplanes-config.error.txt; exit 1; }
          sudo grep -q 'webconfig UI' /boot/firmware/airplanes-config.error.txt \
            || { echo "error.txt does not point at the webconfig UI for LATITUDE"; sudo cat /boot/firmware/airplanes-config.error.txt; exit 1; }
          # LATITUDE must NOT have reached feed.env via this path.
          ! sudo grep -qE '^LATITUDE="51.5"$' /etc/airplanes/feed.env \
            || { echo "LATITUDE leaked into feed.env despite allowlist rejection"; exit 1; }
          # The valid HOSTNAME in the same file should still have been applied.
          [[ "$(sudo cat /etc/hostname | tr -d '\n\r')" = "airplanes-ci-allowlist" ]] \
            || { echo "valid HOSTNAME not applied alongside allowlist rejection"; exit 1; }

      - name: Dump unit logs on failure
        if: failure()
        run: |
          sudo journalctl -u airplanes-first-run.service --no-pager || true
          sudo ls -la /boot/firmware/ || true
          sudo cat /boot/firmware/airplanes-config.error.txt 2>/dev/null || true

  # Real-systemd smoke for airplanes-grant-sudo.service. Installs the unit
  # and the script onto the runner, creates a synthetic UID-1001 human user,
  # starts the unit, and asserts the per-user sudoers grant lands with the
  # right content + mode + owner, that visudo accepts the merged sudoers,
  # and that the synthetic user can actually `sudo -n true`. This is the
  # dynamic counterpart to test/test_grant_sudo_unit.bats (static lint) —
  # catches a future ProtectSystem= re-mount or sandbox tightening that
  # would silently break the sudoers writes.
  grant-sudo-systemd:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install unit + script onto runner
        run: |
          sudo install -m 0755 \
            stage-airplanes/06c-grant-sudo/files/usr/local/sbin/airplanes-grant-sudo \
            /usr/local/sbin/
          sudo install -m 0644 \
            stage-airplanes/06c-grant-sudo/files/etc/systemd/system/airplanes-grant-sudo.service \
            /etc/systemd/system/
          # This job exercises the runtime behavior via `systemctl start`,
          # which bypasses the boot-time ordering graph. Cycle detection
          # through the cloud-init chain is covered by the systemd-verify
          # job, which loads stub cloud-init units alongside ours.
          sudo systemctl daemon-reload

      - name: Create synthetic operator user
        run: |
          # UID 2001 sits above the runner's pre-allocated `runner` user
          # (UID 1001) to avoid the `useradd: UID is not unique` collision.
          # Any UID in the [1000, 65534) range satisfies the script's gate
          # — the exact value doesn't matter, only that it's free.
          sudo useradd -m -s /bin/bash -u 2001 ciop
          # The runner's sudoers default already has `%sudo ALL=(ALL:ALL) ALL`,
          # but ciop is not in the sudo group and has no prior NOPASSWD grant.
          # `sudo -n -u ciop sudo -n true` MUST fail right now — the grant
          # we're about to install is what flips it to success.
          if sudo -n -u ciop sudo -n true 2>/dev/null; then
            echo "precondition failed: ciop already has NOPASSWD sudo before the unit ran" >&2
            exit 1
          fi

      - name: Start the unit and assert grant lands
        run: |
          sudo systemctl start airplanes-grant-sudo.service
          sudo systemctl status airplanes-grant-sudo.service --no-pager

          # All file checks below go through `sudo` because /etc/sudoers.d/
          # is mode 0750 root:root on hosted runners — `[[ -f $GRANT ]]`
          # as the workflow's unprivileged shell user reports "missing"
          # even when the file is in fact present.
          GRANT=/etc/sudoers.d/099_airplanes-sudo-ciop
          sudo test -f "$GRANT" \
            || { echo "expected grant file $GRANT missing"; sudo ls -la /etc/sudoers.d/; exit 1; }
          sudo grep -qE '^ciop ALL=\(ALL:ALL\) NOPASSWD: ALL$' "$GRANT" \
            || { echo "grant content unexpected"; sudo cat "$GRANT"; exit 1; }
          [[ "$(sudo stat -c '%a' "$GRANT")" = "440" ]] \
            || { echo "grant mode is not 0440: $(sudo stat -c '%a' "$GRANT")"; exit 1; }
          [[ "$(sudo stat -c '%U:%G' "$GRANT")" = "root:root" ]] \
            || { echo "grant owner is not root:root: $(sudo stat -c '%U:%G' "$GRANT")"; exit 1; }

          # Validate the merged sudoers is still well-formed.
          sudo visudo -cf /etc/sudoers

          # Effective check: the synthetic user can now sudo without a password.
          # ProtectSystem=full would have silently dropped the grant on the
          # rootfs — this is the dynamic catch the static lint can't provide.
          sudo -n -u ciop sudo -n true \
            || { echo "ciop cannot sudo -n after grant"; exit 1; }

          sudo test -f /var/lib/airplanes/grant-sudo-done \
            || { echo "marker not written"; exit 1; }

      - name: Re-running the unit is a no-op (gated by marker)
        run: |
          # Restart should ConditionPathExists-skip (marker exists).
          sudo systemctl restart airplanes-grant-sudo.service
          # The unit's ActiveState stays active (RemainAfterExit=yes); we
          # verify the condition skipped via the result property.
          state=$(sudo systemctl show airplanes-grant-sudo.service \
                    --property=ConditionResult --value)
          [[ "$state" = "no" ]] \
            || { echo "expected ConditionResult=no on re-run, got '$state'"; exit 1; }

      - name: Dump unit logs on failure
        if: failure()
        run: |
          sudo journalctl -u airplanes-grant-sudo.service --no-pager || true
          sudo ls -la /etc/sudoers.d/ || true

  # Bridge-release verification: install a "release N+1" (a manifest carrying
  # the schema fields manifest_schema_version / installer_min_version /
  # compat.base_os_codename) using "release N's" in-tree updater, proving the
  # forward-compat floor is enforced from the first schema-using release. Runs
  # as a focused job so a regression in the floor surfaces by name, not buried
  # in the broad bats sweep.
  bridge-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install bats + minisign
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bats jq minisign

      - name: Bridge-release install (N+1 on N's updater)
        run: bats test/runtime-overlay/test_bridge_release.bats

  feed-overlay-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: airplanes-live/feed
          ref: dev
          path: feed

      - name: Run overlay smoke
        run: bash test/overlay-smoke.sh feed

  # webconfig-test, webconfig-cross-build, and validator-parity used to live
  # here. They moved to airplanes-live/image-webconfig, which owns the Go
  # source, cross-build, sudoers parity, and JS-vs-bash validator parity now.

  systemd-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Resolve image-webconfig ref from config-stable
        id: webconfig-ref
        run: |
          set -a
          # shellcheck disable=SC1091
          . config-stable
          set +a
          echo "ref=$AIRPLANES_WEBCONFIG_BRANCH" >> "$GITHUB_OUTPUT"

      # Check out airplanes-live/image-webconfig at the config-stable ref so
      # systemd-verify exercises the same unit files that the stable image
      # will install. A drift between the unit file CI verifies and what the
      # image installs would otherwise mean a syntax error blows up on
      # device rather than in CI.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: airplanes-live/image-webconfig
          ref: ${{ steps.webconfig-ref.outputs.ref }}
          path: image-webconfig

      - name: Load tar1090/graphs1090 SHAs from runtime-overlay/config-dev
        run: |
          set -a
          # shellcheck disable=SC1091
          . runtime-overlay/config-dev
          set +a
          {
            echo "AIRPLANES_TAR1090_REPO=$AIRPLANES_TAR1090_REPO"
            echo "AIRPLANES_TAR1090_BRANCH=$AIRPLANES_TAR1090_BRANCH"
            echo "AIRPLANES_GRAPHS1090_REPO=$AIRPLANES_GRAPHS1090_REPO"
            echo "AIRPLANES_GRAPHS1090_BRANCH=$AIRPLANES_GRAPHS1090_BRANCH"
          } >> "$GITHUB_ENV"

      - name: Fetch tar1090 + graphs1090 unit files
        run: |
          set -e
          UNITS_DIR="$RUNNER_TEMP/upstream-units"
          mkdir -p "$UNITS_DIR"
          # tar1090 ships its unit as a template named `tar1090.service` with
          # SOURCE_DIR / SERVICE placeholders the installer sed-substitutes.
          # Substitute the same defaults the chroot install uses so the unit
          # is verifiable.
          curl -fsSL \
            "https://raw.githubusercontent.com/wiedehopf/tar1090/$AIRPLANES_TAR1090_BRANCH/tar1090.service" \
            -o "$UNITS_DIR/tar1090.service.in"
          sed -e 's?SOURCE_DIR?/run/readsb?g' -e 's?SERVICE?tar1090?g' \
            "$UNITS_DIR/tar1090.service.in" > "$UNITS_DIR/tar1090.service"
          curl -fsSL \
            "https://raw.githubusercontent.com/wiedehopf/graphs1090/$AIRPLANES_GRAPHS1090_BRANCH/service.service" \
            -o "$UNITS_DIR/graphs1090.service"
          echo "UPSTREAM_UNITS_DIR=$UNITS_DIR" >> "$GITHUB_ENV"

      - name: Stage units in temp root with stub binaries
        run: |
          ROOT="$RUNNER_TEMP/unit-root"
          mkdir -p "$ROOT/etc/systemd/system" \
                   "$ROOT/usr/local/sbin" \
                   "$ROOT/usr/local/bin" \
                   "$ROOT/usr/local/share/airplanes" \
                   "$ROOT/usr/local/share/tar1090" \
                   "$ROOT/usr/share/graphs1090" \
                   "$ROOT/usr/bin" \
                   "$ROOT/usr/sbin"
          install -m 0644 stage-airplanes/06-firstboot/files/etc/systemd/system/*.service \
              "$ROOT/etc/systemd/system/"
          install -m 0644 stage-airplanes/06-firstboot/files/etc/systemd/system/*.timer \
              "$ROOT/etc/systemd/system/"
          install -m 0644 stage-airplanes/06b-console-dashboard/files/etc/systemd/system/*.service \
              "$ROOT/etc/systemd/system/"
          install -m 0644 runtime-overlay/src/systemd/readsb.service \
              runtime-overlay/src/systemd/airplanes-978.service \
              runtime-overlay/src/systemd/dump978-fa.service \
              runtime-overlay/src/systemd/airplanes-tar1090-uat-sync.service \
              runtime-overlay/src/systemd/airplanes-tar1090-uat-sync.path \
              "$ROOT/etc/systemd/system/"
          # Boot recovery is image-owned (it must survive a broken overlay):
          # the unit and its ExecStart shim ship from stage 02's files/ tree,
          # not the overlay. Stage them from there and create the shim target.
          install -m 0644 \
              stage-airplanes/02-install-runtime-overlay/files/etc/systemd/system/airplanes-runtime-update-recover.service \
              "$ROOT/etc/systemd/system/"
          mkdir -p "$ROOT/usr/local/lib/airplanes-runtime"
          install -m 0755 \
              stage-airplanes/02-install-runtime-overlay/files/usr/local/lib/airplanes-runtime/recover-shim \
              "$ROOT/usr/local/lib/airplanes-runtime/recover-shim"
          install -m 0644 image-webconfig/files/etc/systemd/system/*.service \
              "$ROOT/etc/systemd/system/"
          install -m 0644 stage-airplanes/06c-grant-sudo/files/etc/systemd/system/*.service \
              "$ROOT/etc/systemd/system/"
          install -m 0644 "$UPSTREAM_UNITS_DIR/tar1090.service" \
              "$ROOT/etc/systemd/system/tar1090.service"
          install -m 0644 "$UPSTREAM_UNITS_DIR/graphs1090.service" \
              "$ROOT/etc/systemd/system/graphs1090.service"
          # Stub binaries so ExecStart= path checks resolve.
          install -m 0755 /dev/null "$ROOT/usr/local/sbin/airplanes-first-run"
          install -m 0755 /dev/null "$ROOT/usr/local/sbin/airplanes-grant-sudo"
          install -m 0755 /dev/null "$ROOT/usr/local/bin/apl-feed"
          install -m 0755 /dev/null "$ROOT/usr/local/bin/airplanes-webconfig"
          mkdir -p "$ROOT/usr/local/lib/airplanes-webconfig" "$ROOT/usr/local/lib/airplanes"
          install -m 0755 /dev/null "$ROOT/usr/local/lib/airplanes-webconfig/reset"
          install -m 0755 /dev/null "$ROOT/usr/local/lib/airplanes/render-status"
          install -m 0755 /dev/null "$ROOT/usr/local/share/airplanes/readsb.sh"
          install -m 0755 /dev/null "$ROOT/usr/local/share/airplanes/airplanes-978.sh"
          install -m 0755 /dev/null "$ROOT/usr/local/share/airplanes/dump978-fa.sh"
          install -m 0755 /dev/null "$ROOT/usr/local/share/airplanes/tar1090-uat-sync.sh"
          # tar1090 + graphs1090 ExecStart targets (placeholder shell scripts the
          # upstream installers normally drop in)
          install -m 0755 /dev/null "$ROOT/usr/local/share/tar1090/tar1090.sh"
          install -m 0755 /dev/null "$ROOT/usr/share/graphs1090/service.sh"
          install -m 0755 /dev/null "$ROOT/usr/share/graphs1090/service-graphs1090.sh"
          install -m 0755 /dev/null "$ROOT/usr/sbin/rfkill"
          # util-linux / coreutils binaries referenced by ExecStartPre= in
          # airplanes-dashboard.service (sleep grace + setterm to clear the
          # VT and mute kernel printk on tty1).
          install -m 0755 /dev/null "$ROOT/usr/bin/sleep"
          install -m 0755 /dev/null "$ROOT/usr/bin/setterm"
          # Default env files referenced by EnvironmentFile=
          mkdir -p "$ROOT/etc/default"
          : > "$ROOT/etc/default/tar1090"
          echo "UNIT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: systemd-analyze verify
        # --recursive-errors=no silences "unit not found" warnings for
        # external targets (sysinit.target, network-online.target, etc.) that
        # the temp root doesn't contain. Real syntax errors still fail the run.
        run: |
          systemd-analyze verify --root="$UNIT_ROOT" --recursive-errors=no \
              airplanes-first-run.service \
              airplanes-claim.service \
              airplanes-claim.timer \
              airplanes-rfkill-unblock.service \
              airplanes-dashboard.service \
              airplanes-grant-sudo.service \
              readsb.service \
              dump978-fa.service \
              airplanes-978.service \
              tar1090.service \
              airplanes-tar1090-uat-sync.service \
              airplanes-tar1090-uat-sync.path \
              airplanes-runtime-update-recover.service \
              graphs1090.service \
              airplanes-webconfig.service \
              airplanes-webconfig-reset.service

      - name: Verify no boot-ordering cycle through cloud-init
        # Dedicated cycle check for airplanes-grant-sudo.service. The main
        # systemd-analyze verify above uses --recursive-errors=no, which
        # silences "unit not found" warnings but ALSO prevents cycle
        # detection because the missing-unit edges are dropped from the
        # graph. Here we build a small isolated root with just enough
        # systemd targets + cloud-init stubs to make the dependency graph
        # complete around grant-sudo, then run a strict verify.
        #
        # Regression caught: an earlier version had
        # WantedBy=multi-user.target on grant-sudo, which combined with
        # cloud-final.service After=multi-user.target to form a 3-cycle
        # that systemd silently broke by dropping grant-sudo from the
        # boot transaction. The fix is WantedBy=cloud-init.target; this
        # step makes systemd-analyze the gatekeeper.
        run: |
          set -e
          CYCLE_ROOT="$RUNNER_TEMP/cycle-root"
          mkdir -p "$CYCLE_ROOT/etc/systemd/system" \
                   "$CYCLE_ROOT/usr/local/sbin" \
                   "$CYCLE_ROOT/bin"
          install -m 0644 \
              stage-airplanes/06c-grant-sudo/files/etc/systemd/system/airplanes-grant-sudo.service \
              "$CYCLE_ROOT/etc/systemd/system/"
          install -m 0644 test/systemd-verify-stubs/multi-user.target \
              "$CYCLE_ROOT/etc/systemd/system/multi-user.target"
          install -m 0644 test/systemd-verify-stubs/cloud-init.target \
              "$CYCLE_ROOT/etc/systemd/system/cloud-init.target"
          install -m 0644 test/systemd-verify-stubs/cloud-final.service \
              "$CYCLE_ROOT/etc/systemd/system/cloud-final.service"
          # Minimal stubs for the standard targets pulled in by
          # DefaultDependencies=yes. Without these systemd-analyze
          # short-circuits before the cycle walker runs.
          for t in basic.target sysinit.target shutdown.target rescue.target; do
              printf '[Unit]\nDescription=%s (CI stub)\n' "$t" \
                  > "$CYCLE_ROOT/etc/systemd/system/$t"
          done
          printf '[Unit]\nDescription=Rescue (CI stub)\n[Service]\nType=oneshot\nExecStart=/bin/true\n' \
              > "$CYCLE_ROOT/etc/systemd/system/rescue.service"
          # Materialize [Install] WantedBy= relationships as wants/
          # symlinks so the dep graph reflects what `systemctl enable`
          # would create at install time.
          mkdir -p "$CYCLE_ROOT/etc/systemd/system/multi-user.target.wants" \
                   "$CYCLE_ROOT/etc/systemd/system/cloud-init.target.wants"
          ln -sf ../cloud-init.target \
              "$CYCLE_ROOT/etc/systemd/system/multi-user.target.wants/cloud-init.target"
          ln -sf ../cloud-final.service \
              "$CYCLE_ROOT/etc/systemd/system/cloud-init.target.wants/cloud-final.service"
          ln -sf ../airplanes-grant-sudo.service \
              "$CYCLE_ROOT/etc/systemd/system/cloud-init.target.wants/airplanes-grant-sudo.service"
          install -m 0755 /bin/true "$CYCLE_ROOT/bin/true"
          install -m 0755 /dev/null "$CYCLE_ROOT/usr/local/sbin/airplanes-grant-sudo"
          # Strict verify (no --recursive-errors=no): every referenced
          # unit must be loadable, and any ordering cycle fails the run.
          systemd-analyze verify --root="$CYCLE_ROOT" \
              airplanes-grant-sudo.service \
              cloud-final.service \
              cloud-init.target \
              multi-user.target

  feed-update-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: airplanes-live/feed
          ref: dev
          path: feed

      - name: Run update-regression smoke
        run: bash test/update-regression-smoke.sh feed

      - name: Upload regression artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: update-regression-artifacts
          path: ${{ runner.temp }}/update-regression
