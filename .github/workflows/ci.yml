name: ci

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck

      - name: shellcheck
        run: |
          shopt -s globstar nullglob
          mapfile -d '' files < <(
            find scripts stage-airplanes test -type f \
              \( -name '*.sh' \
                 -o -name 'systemctl-stub' \
                 -o -name 'airplanes-first-run' \
                 -o -name 'render-status' \
                 -o -name '10-airplanes-status' \) \
              -print0
          )
          if (( ${#files[@]} == 0 )); then
            echo "no scripts to check" >&2
            exit 1
          fi
          shellcheck "${files[@]}"

      - name: bash -n
        run: |
          shopt -s globstar nullglob
          for f in scripts/systemctl-stub scripts/*.sh \
                   stage-airplanes/**/*.sh \
                   stage-airplanes/**/files/**/airplanes-first-run \
                   stage-airplanes/**/files/**/render-status \
                   stage-airplanes/**/files/**/10-airplanes-status \
                   test/*.sh; do
            [[ -e "$f" ]] || continue
            bash -n "$f"
          done

      - name: No nested on_chroot in *-run-chroot.sh
        run: |
          # pi-gen's build.sh already invokes each *-run-chroot.sh via
          # `on_chroot < script.sh`, so the body executes inside the chroot
          # where on_chroot is undefined. A nested call silently broke the
          # 06b stage in PR #29; this guard prevents a repeat. Anchored at
          # line-start so docstring mentions don't trip it.
          shopt -s globstar nullglob
          if grep -nE '^[[:space:]]*on_chroot([[:space:]<;]|$)' \
               stage-airplanes/**/*-run-chroot.sh; then
            echo "*-run-chroot.sh files are already executed via on_chroot by pi-gen build.sh" >&2
            exit 1
          fi

  bats:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bats

      - name: bats test/
        run: bats test/

  overlay-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: airplanes-live/feed
          ref: dev
          path: feed

      - name: Run overlay smoke
        run: bash test/overlay-smoke.sh feed

  go-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: webconfig/go.mod
          cache-dependency-path: webconfig/go.sum

      - name: go vet
        working-directory: webconfig
        run: go vet ./...

      - name: go mod verify
        working-directory: webconfig
        run: go mod verify

      - name: go test
        working-directory: webconfig
        run: go test ./...

  go-cross-build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - arch: arm64
            goarch: arm64
            goarm: ''
          - arch: armhf
            goarch: arm
            goarm: '7'
      fail-fast: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: webconfig/go.mod
          cache-dependency-path: webconfig/go.sum

      - name: cross-build webconfig for ${{ matrix.arch }}
        working-directory: webconfig
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          go build -trimpath -buildvcs=false \
              -ldflags "-s -w -X main.version=ci" \
              -o /tmp/airplanes-webconfig.${{ matrix.arch }} \
              ./cmd/webconfig
          file /tmp/airplanes-webconfig.${{ matrix.arch }}

  unit-files:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Load tar1090/graphs1090 SHAs from config-dev
        run: |
          set -a
          # shellcheck disable=SC1091
          . config-dev
          set +a
          {
            echo "AIRPLANES_TAR1090_REPO=$AIRPLANES_TAR1090_REPO"
            echo "AIRPLANES_TAR1090_BRANCH=$AIRPLANES_TAR1090_BRANCH"
            echo "AIRPLANES_GRAPHS1090_REPO=$AIRPLANES_GRAPHS1090_REPO"
            echo "AIRPLANES_GRAPHS1090_BRANCH=$AIRPLANES_GRAPHS1090_BRANCH"
          } >> "$GITHUB_ENV"

      - name: Fetch tar1090 + graphs1090 unit files
        run: |
          set -e
          UNITS_DIR="$RUNNER_TEMP/upstream-units"
          mkdir -p "$UNITS_DIR"
          # tar1090 ships its unit as a template named `tar1090.service` with
          # SOURCE_DIR / SERVICE placeholders the installer sed-substitutes.
          # Substitute the same defaults the chroot install uses so the unit
          # is verifiable.
          curl -fsSL \
            "https://raw.githubusercontent.com/wiedehopf/tar1090/$AIRPLANES_TAR1090_BRANCH/tar1090.service" \
            -o "$UNITS_DIR/tar1090.service.in"
          sed -e 's?SOURCE_DIR?/run/readsb?g' -e 's?SERVICE?tar1090?g' \
            "$UNITS_DIR/tar1090.service.in" > "$UNITS_DIR/tar1090.service"
          curl -fsSL \
            "https://raw.githubusercontent.com/wiedehopf/graphs1090/$AIRPLANES_GRAPHS1090_BRANCH/service.service" \
            -o "$UNITS_DIR/graphs1090.service"
          echo "UPSTREAM_UNITS_DIR=$UNITS_DIR" >> "$GITHUB_ENV"

      - name: Stage units in temp root with stub binaries
        run: |
          ROOT="$RUNNER_TEMP/unit-root"
          mkdir -p "$ROOT/etc/systemd/system" \
                   "$ROOT/usr/local/sbin" \
                   "$ROOT/usr/local/bin" \
                   "$ROOT/usr/local/share/airplanes" \
                   "$ROOT/usr/local/share/tar1090" \
                   "$ROOT/usr/share/graphs1090" \
                   "$ROOT/usr/bin" \
                   "$ROOT/usr/sbin"
          install -m 0644 stage-airplanes/06-firstboot/files/etc/systemd/system/*.service \
              "$ROOT/etc/systemd/system/"
          install -m 0644 stage-airplanes/06-firstboot/files/etc/systemd/system/*.timer \
              "$ROOT/etc/systemd/system/"
          install -m 0644 stage-airplanes/06b-console-dashboard/files/etc/systemd/system/*.service \
              "$ROOT/etc/systemd/system/"
          install -m 0644 stage-airplanes/02-install-decoder/files/etc/systemd/system/*.service \
              "$ROOT/etc/systemd/system/"
          install -m 0644 stage-airplanes/05-install-webconfig/files/etc/systemd/system/*.service \
              "$ROOT/etc/systemd/system/"
          install -m 0644 "$UPSTREAM_UNITS_DIR/tar1090.service" \
              "$ROOT/etc/systemd/system/tar1090.service"
          install -m 0644 "$UPSTREAM_UNITS_DIR/graphs1090.service" \
              "$ROOT/etc/systemd/system/graphs1090.service"
          # Stub binaries so ExecStart= path checks resolve.
          install -m 0755 /dev/null "$ROOT/usr/local/sbin/airplanes-first-run"
          install -m 0755 /dev/null "$ROOT/usr/local/bin/apl-feed"
          install -m 0755 /dev/null "$ROOT/usr/local/bin/airplanes-webconfig"
          mkdir -p "$ROOT/usr/local/lib/airplanes-webconfig" "$ROOT/usr/local/lib/airplanes"
          install -m 0755 /dev/null "$ROOT/usr/local/lib/airplanes-webconfig/reset"
          install -m 0755 /dev/null "$ROOT/usr/local/lib/airplanes/render-status"
          install -m 0755 /dev/null "$ROOT/usr/local/share/airplanes/readsb.sh"
          install -m 0755 /dev/null "$ROOT/usr/local/share/airplanes/airplanes-978.sh"
          install -m 0755 /dev/null "$ROOT/usr/local/share/airplanes/dump978-fa.sh"
          # tar1090 + graphs1090 ExecStart targets (placeholder shell scripts the
          # upstream installers normally drop in)
          install -m 0755 /dev/null "$ROOT/usr/local/share/tar1090/tar1090.sh"
          install -m 0755 /dev/null "$ROOT/usr/share/graphs1090/service.sh"
          install -m 0755 /dev/null "$ROOT/usr/share/graphs1090/service-graphs1090.sh"
          install -m 0755 /dev/null "$ROOT/usr/sbin/rfkill"
          # Default env files referenced by EnvironmentFile=
          mkdir -p "$ROOT/etc/default"
          : > "$ROOT/etc/default/tar1090"
          echo "UNIT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: systemd-analyze verify
        # --recursive-errors=no silences "unit not found" warnings for
        # external targets (sysinit.target, network-online.target, etc.) that
        # the temp root doesn't contain. Real syntax errors still fail the run.
        run: |
          systemd-analyze verify --root="$UNIT_ROOT" --recursive-errors=no \
              airplanes-first-run.service \
              airplanes-claim.service \
              airplanes-claim.timer \
              airplanes-rfkill-unblock.service \
              airplanes-dashboard.service \
              readsb.service \
              dump978-fa.service \
              airplanes-978.service \
              tar1090.service \
              graphs1090.service \
              airplanes-webconfig.service \
              airplanes-webconfig-reset.service

  update-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: airplanes-live/feed
          ref: dev
          path: feed

      - name: Run update-regression smoke
        run: bash test/update-regression-smoke.sh feed

      - name: Upload regression artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: update-regression-artifacts
          path: ${{ runner.temp }}/update-regression
