name: ci

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck

      - name: shellcheck
        run: |
          shopt -s globstar nullglob
          mapfile -d '' files < <(
            find scripts stage-airplanes test -type f \
              \( -name '*.sh' -o -name 'systemctl-stub' -o -name 'airplanes-first-run' \) \
              -print0
          )
          if (( ${#files[@]} == 0 )); then
            echo "no scripts to check" >&2
            exit 1
          fi
          shellcheck "${files[@]}"

      - name: bash -n
        run: |
          shopt -s globstar nullglob
          for f in scripts/systemctl-stub scripts/*.sh \
                   stage-airplanes/**/*.sh \
                   stage-airplanes/**/files/**/airplanes-first-run \
                   test/*.sh; do
            [[ -e "$f" ]] || continue
            bash -n "$f"
          done

  bats:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bats

      - name: bats test/
        run: bats test/

  overlay-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: airplanes-live/feed
          ref: dev
          path: feed

      - name: Run overlay smoke
        run: bash test/overlay-smoke.sh feed
