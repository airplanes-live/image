# Map http://feeder/skyaware978/ → /run/airplanes-978/ so tar1090's UAT view
# (default URL_978="http://127.0.0.1/skyaware978") resolves to airplanes-978's
# JSON output. Harmless when UAT_INPUT is empty / 978 is disabled (the dir
# is missing/empty).
alias.url += ( "/skyaware978" => "/run/airplanes-978" )
