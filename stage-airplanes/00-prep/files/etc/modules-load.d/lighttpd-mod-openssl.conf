# Override the lighttpd-mod-openssl package's
# /usr/lib/modules-load.d/lighttpd-mod-openssl.conf, which tries to
# auto-load the `tls` kernel module (kernel-TLS offload). That module is
# not built in the Raspberry Pi kernel, so systemd-modules-load logs
# "Failed to find module 'tls'" on every boot. lighttpd does TLS in
# userspace via OpenSSL — kernel TLS offload is not used — so suppressing
# the load is correct.
#
# Empty body. systemd-modules-load processes /etc before /usr and skips
# the package's file once the same filename exists in /etc.
