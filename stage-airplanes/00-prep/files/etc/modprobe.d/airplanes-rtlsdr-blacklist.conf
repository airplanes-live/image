# Keep the Linux kernel DVB-T / V4L2-SDR drivers off RTL2832U dongles so the
# ADS-B stack can claim them from userspace: readsb via librtlsdr, dump978-fa
# via SoapySDR -> SoapyRTLSDR -> librtlsdr; both reach the device through
# libusb and need no kernel SDR module. Left unblacklisted, dvb_usb_rtl28xxu
# binds a dongle at boot and runs an IR-remote poller, which races librtlsdr's
# open-time kernel detach and is unreliable when two SDRs are present.
#
# Only the device-specific drivers are listed. The shared DVB/V4L2 framework
# (dvb_core, dvb_usb_v2, videobuf2_*, videodev) and the generic USB stack
# (usbcore, usbfs, xhci_hcd) are left untouched.
#
# modprobe.d affects future module loads only: a freshly flashed image is
# clean from first boot, but an already-running feeder needs a reboot for
# this to take effect.
blacklist dvb_usb_rtl28xxu
blacklist rtl2832
blacklist rtl2832_sdr
blacklist rtl2830
