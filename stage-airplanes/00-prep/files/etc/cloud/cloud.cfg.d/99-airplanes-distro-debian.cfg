# Override Raspberry Pi OS's `system_info: distro: raspberry-pi-os` (set in
# /etc/cloud/cloud.cfg). The raspberry_pi_os Distro reroutes add_user()
# through /usr/lib/userconf-pi/userconf, which internally runs
# `systemctl enable --now getty@tty1.service`. Stage 06b masks getty@tty1
# (airplanes-dashboard owns /dev/tty1), so userconf exits 1 → cc_users_groups
# raises before setup_user_keys runs → rpi-imager-supplied SSH keys never
# land in /home/<user>/.ssh. The standard debian Distro uses `useradd`
# directly and then runs the normal ssh-key install path. The
# raspberry_pi_os Distro hooks we lose (set_keymap → labwc/squeekboard,
# generate_fallback_config) only matter for the desktop image; this is
# a headless feeder.
system_info:
  distro: debian
