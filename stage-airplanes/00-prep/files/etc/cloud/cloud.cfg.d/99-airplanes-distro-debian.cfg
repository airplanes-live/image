# Override Raspberry Pi OS's `system_info: distro: raspberry-pi-os` (set in
# /etc/cloud/cloud.cfg). The raspberry_pi_os Distro reroutes add_user()
# through /usr/lib/userconf-pi/userconf, which calls /usr/bin/cancel-rename,
# which calls `raspi-config nonint do_boot_behaviour`, which runs
# `systemctl enable --now getty@tty1.service`. Stage 06b masks getty@tty1
# (airplanes-dashboard owns /dev/tty1), so the chain exits 1 →
# cc_users_groups raises before setup_user_keys runs → rpi-imager-supplied
# SSH keys never land in /home/<user>/.ssh. The standard debian Distro uses
# `useradd` directly and then runs the normal ssh-key install path.
#
# Tradeoffs we accept:
# - cc_raspberry_pi (which handles rpi: { interfaces, enable_usb_gadget }
#   from rpi-imager customisation) is gated on distros: ["raspberry-pi-os"]
#   and stops running. SPI/I2C/serial/USB-gadget toggles set in the imager
#   no longer auto-apply; users who need them can flip via webconfig or
#   `sudo raspi-config nonint do_serial_hw 0` etc post-boot.
# - Locale, keyboard, set_keymap follow standard debian cloud-init behaviour
#   instead of raspberry_pi_os's labwc / squeekboard / raspi-config wrappers
#   (those exist for the Raspberry Pi OS desktop; this is headless).
# - generate_fallback_config falls back to cloud-init's default rather than
#   returning None. Harmless: rpi-imager writes /boot/firmware/network-config
#   so the fallback path is never taken.
system_info:
  distro: debian
