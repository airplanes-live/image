# Reverse-proxy / and /api/* to airplanes-webconfig (127.0.0.1:8080).
# tar1090, graphs1090, and skyaware978 own their own URL prefixes via alias.url
# in earlier-loaded snippets — exclude them here so they're served from the
# filesystem instead of being forwarded to webconfig.
#
# mod_proxy itself is enabled in chroot via lighttpd-enable-mod proxy so the
# `proxy.server` directive resolves at config-load time.
$HTTP["url"] !~ "^/(tar1090|graphs1090|skyaware978)(/|$)" {
    proxy.server = ( "" => (
        ( "host" => "127.0.0.1", "port" => 8080 )
    ) )
}
